<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · TheLifeHolics</title>
  <style>
    body {
      background-color: #f6f1ea;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
    }
    h1 {
      font-family: serif;
      font-size: 28px;
      margin: 0 0 10px 0;
      color: #c5a880;
    }
    p {
      font-size: 14px;
      line-clamp: 3;
      color: #666666;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .btn {
      background: #c5a880;
      color: #ffffff;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #b1936c;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Please check your internet connection and try reloading the page to restore your somatic healing portal.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
